# PR / push 到 main 的快路径门禁（对应 make gate-pr）。
# 刻意不含：vet-gui / gate-gui（GTK/WebKit pkg-config 与链接）、race（~6min）、
# test-offline / test-netns-fw（unshare + 挂载 netns）、fuzz-smoke（多目标模糊测试）。
# 上述步骤在 nightly.yml 里跑；本地全套仍用 `make gate`。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # geoip.mmdb 因许可不入库；internal/rules 性能闸需要它（README §3）。
      - name: Fetch GeoIP for Go tests
        run: ./scripts/fetch-assets.sh

      - name: make gate-pr
        run: make gate-pr
